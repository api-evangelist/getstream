      operationId: delete_action_config
      parameters:
      - in: path
        name: id
        required: true
        schema:
          description: UUID of the action config to delete
          title: ID
          type: string
          writeOnly: true
          x-stream-index: '001'
      - in: query
        name: user_id
        schema:
          description: Optional user ID to associate with the audit log entry
