  /api/v2/moderation/action_config:
    get:
      description: Returns moderation action configs grouped by entity type, sorted by order ascending. Supports fetching DB-configured actions, hardcoded defaults, or both.
      operationId: get_action_config
      parameters:
      - in: query
        name: queue_type
        schema:
          description: Filter configs by queue type; empty returns the default queue
          title: Queue Type
          type: string
          writeOnly: true
          x-stream-index: '001'
      - in: query
        name: entity_type
        schema:
          description: Filter to a single entity type; empty returns all
          title: Entity Type
          type: string
          writeOnly: true
          x-stream-index: '002'
      - in: query
        name: exclude_defaults
        schema:
          description: Return only DB-configured actions; empty object if none exist
          title: Exclude Defaults
          type: boolean
          writeOnly: true
          x-stream-index: '003'
      - in: query
        name: only_defaults
        schema:
          description: Return hardcoded default configs without a DB query
          title: Only Defaults
          type: boolean
          writeOnly: true
          x-stream-index: '004'
      - in: query
        name: user_id
        schema:
          type: string
          writeOnly: true
          x-stream-index: '005.001'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActionConfigResponse'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Too many requests
      summary: Get moderation action configs
      tags:
      - product:moderation
    post:
      description: Create a new moderation action config entry or update an existing one. Action configs control the action buttons displayed in the moderation dashboard for each entity type.
      operationId: upsert_action_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertActionConfigRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertActionConfigResponse'
          description: Successful response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Too many requests
      summary: Create or update a moderation action config
      tags:
      - product:moderation
  /api/v2/moderation/action_config/{id}:
