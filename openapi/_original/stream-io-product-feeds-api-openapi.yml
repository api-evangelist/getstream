        name: id
        required: true
        schema:
          type: string
          writeOnly: true
          x-stream-index: '001'
      - in: query
        name: comment_sort
        schema:
          description: 'Order of comments in the activity. One of: first, last, popular'
          enum:
          - first
          - last
          - popular
          title: Comment Sort
          type: string
          writeOnly: true
          x-stream-index: '002'
      - in: query
        name: comment_limit
        schema:
          description: Maximum number of comments to return
          format: int32
          maximum: 20
          minimum: 0
          title: Comment Limit
          type: integer
          writeOnly: true
          x-stream-index: '003'
      - in: query
        name: user_id
        schema:
          type: string
          writeOnly: true
          x-stream-index: '004.001'
